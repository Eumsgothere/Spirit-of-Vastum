# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name spiritofvastum.thirdeyefeu.dev;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name spiritofvastum.thirdeyefeu.dev;

    ssl_certificate /etc/letsencrypt/live/spiritofvastum.thirdeyefeu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiritofvastum.thirdeyefeu.dev/privkey.pem;

    # Forward all requests to Docker Nginx on 8090
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
