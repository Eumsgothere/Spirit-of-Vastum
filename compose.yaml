version: "3.9"

services:
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      CI_ENVIRONMENT: development
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
  image: nginx:alpine
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./backend:/var/www/html
    - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - /etc/letsencrypt/live/spiritofvastum.thirdeyefeu.dev/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
    - /etc/letsencrypt/live/spiritofvastum.thirdeyefeu.dev/privkey.pem:/etc/ssl/private/privkey.pem:ro
  depends_on:
    php:
      condition: service_started


  mysql:
    image: mysql:8.0
    ports:
      - "3390:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command: [ "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8091:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
